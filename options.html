<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Closet 灵感采集</title><link rel="icon" type="image/png" href="icons/icon-32.png">
<style>body{width:320px;margin:0;padding:24px;background:#f7f8f3;color:#23281e;font:14px/1.6 system-ui}h1{display:flex;align-items:center;gap:10px;font-size:22px;margin:0}h1 img{width:36px;height:36px;border-radius:8px}p{color:#6a7063}label{display:block;margin:16px 0}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cdd1c3;border-radius:8px;font:inherit}button{background:#303d26;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #78945b;outline-offset:2px}#status{overflow-wrap:anywhere}</style>
<h1><img src="icons/icon-128.png" alt="">Closet 灵感采集</h1><p>将小红书、抖音视频与微信公众号图片图集采集到 Closet，并自动发布。登录消费站后可自动连接，无需填写密钥。</p>
<form><label>Closet 服务地址<input id="server" type="url" value="https://closet.cuddlycuddle.com" placeholder="https://closet.cuddlycuddle.com" required></label><label>采集凭据<input id="token" type="password" readonly aria-label="自动获取的采集凭据" placeholder="登录后自动获取"></label><button>自动连接登录账号</button> <button id="login" type="button">打开消费站登录</button></form><p id="status" role="status" aria-live="polite"></p><section id="tasks" aria-live="polite"></section><script src="history-ui.js"></script><script src="options.js"></script></html>
